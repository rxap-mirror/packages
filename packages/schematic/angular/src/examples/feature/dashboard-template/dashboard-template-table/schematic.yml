package: "@rxap/schematic-angular"
name: table-component
options:
  name: dashboard-template
  backend: nestjs
  sortable: true
  rowId:
    name: uuid
  modifiers:
    - show-archived-slide
  headerButton:
    role: form
    permission: dashboard-template.create
    options:
      customComponent: true
      formComponent: CreateForm
  propertyList:
    - name: __archived
      type: boolean
  columnList:
    - name: __removedAt
      kind: date
      inactive: true
      hidden: true
    - name: type
      kind: icon
    - name: name
      hasFilter: true
      type: string
    - name: machine-template
      hasFilter: true
      type: string
    - name: version-range
      type: string
    - name: location
      hasFilter: true
      type: string
    - name: lastRefresh
      kind: date
  actionList:
    - type: edit
      role: form
      refresh: true
      icon: edit
      permission: dashboard-template.update
      checkFunction: "!element.__archived"
      options:
        customComponent: true
        formComponent: EditForm
    - type: delete
      icon: delete
      refresh: true
      confirm: true
      inHeader: true
      permission: dashboard-template.delete
      checkFunction: "!!element.__archived"
      role: operation
      color: warn
    - type: archive
      role: operation
      refresh: true
      confirm: true
      inHeader: true
      permission: dashboard-template.archive
      checkFunction: "!element.__archived"
    - type: restore
      role: operation
      refresh: true
      inHeader: true
      confirm: true
      permission: dashboard-template.archive
      checkFunction: "!!element.__archived"
    - type: global-rollout
      icon: upgrade
      role: operation
      confirm: true
      permission: dashboard-template.global-rollout
      checkFunction: "!element.__archived"
    - type: refresh-dashboard-model
      permission: dashboard-template.refresh-dashboard-model
      icon: playlist_add
      checkFunction: "!element.__archived"
      role: form
      confirm: true
      options:
        customComponent: true
        formComponent: RefreshDashboardModelForm
    - type: create-dashboard
      icon: add
      role: form
      permission: dashboard-template.create-dashboard
      checkFunction: "!element.__archived"
      options:
        customComponent: true
        formComponent: CreateDashboardForm
