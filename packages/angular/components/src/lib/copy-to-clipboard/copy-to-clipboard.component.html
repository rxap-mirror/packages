<div class="flex flex-row gap-2 items-center">
  @if (active() && isPositionBefore()) {
    <rxap-copy-to-clipboard-button [value]="value()" class="w-[40px]"></rxap-copy-to-clipboard-button>
  }
  <span #ref class="grow {{ containerClass() }}" [ngClass]="{ 'hidden': !ref.innerHTML.trim() }"><ng-content></ng-content></span>
  @if (!ref.innerHTML.trim()) {
    <span class="grow">{{ value() }}</span>
  }
  @if (active() && isPositionAfter()) {
    <rxap-copy-to-clipboard-button [value]="value()" class="w-[40px]"></rxap-copy-to-clipboard-button>
  }
</div>
