<div #container
     (cdkDragEnded)="onDragEnded($event)"
     [cdkDragDisabled]="windowRef.draggable === false"
     [ngStyle]="{
     'width': width(),
     'height': height(),
     'minWidth': windowRef.minWidth,
     'minHeight': windowRef.minHeight,
     'maxWidth': windowRef.maxWidth,
     'maxHeight': windowRef.maxHeight
     }"
     cdkDrag
     cdkDragBoundary=".cdk-overlay-container"
     class="drop-shadow-2xl bg-white dark:bg-black border-2 border-gray-400 dark:border-gray-800 rounded-xl overflow-hidden">
  <div class="flex flex-col h-full max-h-full">

    <div cdkDragHandle class="grow-0 w-full h-[64px] min-h-[64px] cursor-move">
      <rxap-window-tool-bar></rxap-window-tool-bar>
    </div>

    <div class="grow overflow-auto w-full">
      <ng-content></ng-content>
    </div>

    @if (windowRef.footerPortal$ | async; as footerPortal) {
      <mat-toolbar class="mat-elevation-z1 grow-0 w-full h-[64px] min-h-[64px]">
        <ng-template [cdkPortalOutlet]="footerPortal"></ng-template>
      </mat-toolbar>
    }

    @if (windowInstance.isLoading$ | async) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <rxap-window-resizer [containerRef]="containerRef"></rxap-window-resizer>
  </div>
</div>
