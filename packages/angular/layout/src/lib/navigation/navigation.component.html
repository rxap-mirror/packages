@for (item of navigationItems(); track item) {

  @if (isNavigationDividerItem(item)) {
    <mat-divider></mat-divider>
    @if (!collapsed() && item.title) {
      <div class="pl-5 h-6">
        {{item.title}}
      </div>
    }
  } @else if (isNavigationItem(item)) {
    <li [item]="asNavigationItem(item)"
      [level]="level()"
      rxap-navigation-item>
    </li>
  }

}
