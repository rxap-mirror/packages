<div class="flex flex-row justify-between items-center gap-8">
  <div class="flex grow-0 flex-row justify-end items-center gap-8 w-full">
    <button (click)="reset()"
      [disabled]="submitting()"
      class="grow-0"
      mat-stroked-button
      type="button">
      <ng-container i18n>Reset</ng-container>
    </button>
    <button (click)="cancel()"
      [disabled]="submitting()"
      color="warn"
      class="grow-0"
      mat-stroked-button
      type="button">
      <ng-container i18n>Cancel</ng-container>
    </button>
    <button (click)="submit(!allowResubmit())"
      [disabled]="submitting()"
      [ngClass]="{ invalid: invalid() }"
      color="primary"
      class="grow-0"
      mat-raised-button
      type="button">
      <span class="flex flex-row items-center gap-2">
        <span class="grow-0">
          <ng-container i18n>Submit</ng-container>
        </span>
        @if (submitting()) {
          <mat-spinner [diameter]="15" color="accent" class="grow-0"
          mode="indeterminate"></mat-spinner>
        }
      </span>
    </button>
    @if (allowResubmit()) {
      <button (click)="submit(true)"
        [disabled]="submitting()"
        [ngClass]="{ invalid: invalid() }"
        color="primary"
        class="grow-0"
        mat-raised-button
        type="button">
        <span class="flex flex-row items-center gap-2">
          <span class="grow-0">
            <ng-container i18n>Submit and Close</ng-container>
          </span>
          @if (submitting()) {
            <mat-spinner [diameter]="15" color="accent" class="grow-0"
            mode="indeterminate"></mat-spinner>
          }
        </span>
      </button>
    }
    @if (isDevMode) {
      <button (click)="logCurrentFormState()" mat-button type="button" class="grow-0">
        Current Form State
      </button>
    }
  </div>
</div>
