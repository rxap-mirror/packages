version: "3.7"
networks:
  default:
    name: traefik
services:
  traefik:
    image: traefik:latest
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $XDG_RUNTIME_DIR/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik:/etc/traefik:ro
    ports:
      - "${ROOT_DOMAIN_PORT}:443"
      - "8888:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=https
      - traefik.http.routers.traefik.rule=Host(`traefik.${ROOT_DOMAIN}`)
      - traefik.http.services.traefik.loadbalancer.server.port=8080
    environment:
      - REMOTE_DOMAIN
      - ROOT_DOMAIN
      - ROOT_DOMAIN_PORT
      - HOST_IP
  catch-all-api:
    image: registry.gitlab.com/rxap/docker/catch-all:alpine
  rxap-service-configuration:
    image: registry.gitlab.com/rxap/applications/services/configuration:${RXAP_SERVICE_CONFIGURATION:-development}
    volumes:
      - ./shared/service/configuration:/app/assets
    environment:
      - STATUS_SERVICE_BASE_URL=http://rxap-service-status:3000
      - ROOT_DOMAIN
      - SENTRY_ENABLED=false
      - LOG_LEVEL=verbose
      - ROOT_DOMAIN_PORT
      - ENVIRONMENT_NAME=development
    env_file:
      - .env
    depends_on:
      - traefik
      - rxap-service-status
  rxap-service-status:
    image: registry.gitlab.com/rxap/applications/services/status:${RXAP_SERVICE_STATUS:-development}
    environment:
      - ROOT_DOMAIN
      - SENTRY_ENABLED=false
      - LOG_LEVEL=verbose
      - ROOT_DOMAIN_PORT
      - ENVIRONMENT_NAME=development
    env_file:
      - .env
    depends_on:
      - traefik
    ports:
      - "5300:3000"
  rxap-service-changelog:
    image: registry.gitlab.com/rxap/applications/services/changelog:${RXAP_SERVICE_CHANGELOG:-development}
    environment:
      - STATUS_SERVICE_BASE_URL=http://rxap-service-status:3000
      - ROOT_DOMAIN
      - SENTRY_ENABLED=false
      - LOG_LEVEL=verbose
      - ROOT_DOMAIN_PORT
      - ENVIRONMENT_NAME=development
    env_file:
      - .env
    volumes:
      - ./shared/service/changelog:/app/assets
    depends_on:
      - traefik
      - rxap-service-status
  rxap-service-user:
    image: registry.gitlab.com/rxap/applications/services/user:${RXAP_SERVICE_USER:-development}
    environment:
      - STATUS_SERVICE_BASE_URL=http://rxap-service-status:3000
      - ROOT_DOMAIN
      - SENTRY_ENABLED=false
      - LOG_LEVEL=verbose
      - ROOT_DOMAIN_PORT
      - ENVIRONMENT_NAME=development
    env_file:
      - .env
    volumes:
      - ./shared/service/user:/app/assets
    depends_on:
      - traefik
      - rxap-service-status
  cors-options:
    image: registry.gitlab.com/rxap/docker/cors-options:alpine
