package: "@rxap/schematic-angular"
name: accordion-component
options:
  name: dashboard
  backend: nestjs
  multiple: true
  header:
    property:
      name: name
  persistent:
    property:
      name: uuid
  identifier:
    source: route
    property:
      name: uuid
  upstream:
    kind: open-api
    operationId: dashboard-controller-getByUuid@legacy
  propertyList:
    - name: dashboardType
      type: number
      source: "dashboardType!"
    - name: name
      source: "name!"
  itemList:
    - name: general-information
      kind: switch
      switch:
        property:
          name: dashboardType
          type: number
        defaultCase:
          itemList:
            - kind: data-grid
              name: dashboard
              title: Allgemeine Informationen
              propertyList:
                - name: name
                  type: string
                  source: "name!"
                - name: location
                  source: "location?.uuid!"
                  type: string
                - name: link
                  source: "link!"
                  type: string
                - name: company
                  source: "company?.uuid!"
                  type: string
                - name: dashboardType
                  source: "dashboardType!"
                  type: number
              upstream:
                kind: open-api
                operationId: dashboard-controller-getByUuid@legacy
              dataGrid:
                itemList:
#                  - name: name
#                    hasCellDef: true
#                    formControl:
#                      kind: input
                  - name: location
                    formControl:
                      kind: autocomplete-table-select
                      backend: nestjs
                      toValue:
                        property:
                          name: uuid
                      columnList:
                        - name: name
                          hasFilter: true
                      resolver:
                        upstream:
                          kind: open-api
                          operationId: company-gui-controller-getByUuid@legacy
                          mapper:
                            value: uuid
                      upstream:
                        kind: open-api
                        operationId: company-gui-controller-getByFilter@legacy
                        mapper:
                          pageIndex: page
                          pageSize: size
                          sortBy: sort
                          sortDirection: order
                          list: entities
                          total: maxCount
                          filter:
                            eq: ':'
                            join: ';'
