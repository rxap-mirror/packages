---
variables:
  ADDITIONAL_TARGET_OPTIONS: --exclude tag:demo
  NX_MIGRATE_POST_SCRIPT: post-migrate
  RXAP_COMPOSE_COMMAND: schematic
  # Load the Nx plugins in the Nx process instead of one worker process per plugin (13 plugins): the project graph
  # peaks at 0.9 GiB instead of 2.8 GiB (CI-RUNNERS.md). CI runs with NX_DAEMON=false, one Nx process per job.
  NX_ISOLATE_PLUGINS: "false"
  # The local plugins are ESM-syntax .ts sources: Node's native type stripping fails on them ("Failed to load the
  # ES module" warning per plugin) before Nx falls back to swc-node. Use swc-node directly.
  NX_PREFER_NODE_STRIP_TYPES: "false"
  # The release inputs of the Run pipeline form (spec above) → the variables of .gitlab/ci/release.yml. A variable of
  # the same name set by a schedule or on the Run pipeline form wins (pipeline variables take precedence), so the
  # Nightly release schedule (NX_RELEASE=nightly) and RELEASE_SPECIFIER=<explicit version> keep working.
  NX_RELEASE: $[[ inputs.release ]]
  RELEASE_SPECIFIER: $[[ inputs.release_specifier ]]
  RELEASE_PROJECTS: "$[[ inputs.release_projects_angular_1 ]] $[[ inputs.release_projects_angular_2 ]] $[[ inputs.release_projects_nest ]] $[[ inputs.release_projects_tooling ]] $[[ inputs.release_projects_other ]]"
# No job of this project runs untagged: the GitLab-hosted runners are enabled for release:npm only (tag
# saas-linux-small-amd64), an untagged job would land there and use the free compute minutes. Jobs without tags of
# their own (writerside and other GitLab / component templates) get the small size; see CI-RUNNERS.md §4.
default:
  tags:
    - mlr-linux-small-amd64
include:
  # scheduled maintenance pipelines (Renovate, supply-chain audit, framework watch, releases) only run their own
  # job: the workspace components (setup, run-many, pages, ...) are not loaded for them
  # include:rules do not see the top-level `variables:` above, so a release started through the `release` input is
  # tested on the input itself: `/^(?:)/` (input empty) matches every path, a release kind matches none
  - component: gitlab.com/rxap/gitlab-ci/base@~latest
    rules: &workspace-pipeline
      - if: '$RENOVATE == "true" || $SUPPLY_CHAIN_AUDIT == "true" || $FRAMEWORK_WATCH == "true" || $NX_RELEASE || $CI_PROJECT_PATH !~ /^(?:$[[ inputs.release ]])/'
        when: never
      - when: always
  - component: gitlab.com/rxap/gitlab-ci/nx-workspace@6.4.0-edge.65
    rules: *workspace-pipeline
    inputs:
      version: "6.4.0-edge.65"
      # keep in sync with .nvmrc (the component default is the Node 22 image jod-alpine)
      node_version: "26.13-alpine"
      workflow_rules:
        # skip realseit pipelines. currently the group terraform will add the release it nighlity pipeline schdule
        # this will trigger a nighlty run with RELEASE_IT=true, but this repo does not use release-it but nx release
        # so this will trigger a full pipeline run per night and drain the CI credits
        - if: '$RELEASE_IT == "true"'
          when: never
        # Same two rules as the component default (templates/nx-workspace.yml `workflow_rules`), which this list
        # replaces: a plain push to a `<prefix>/` branch (feature/, fix/, claude/, epic/ ...) starts no pipeline, its
        # merge request pipeline covers it (a pipeline is created otherwise; the config itself is kept valid for
        # such refs by the include rules of workspace-test.yml).
        # rxap/, renovate/ and migrate/ branches (rxap-compose, Renovate, framework watch: the nx-migrate job runs in
        # their push pipeline) keep it (RE2 has no negative lookahead: matched first).
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(rxap|renovate|migrate)\//'
          variables:
            ENVIRONMENT_NAME: 'branch/$CI_COMMIT_REF_SLUG'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^[^\/]+\//'
          variables:
            ENVIRONMENT_NAME: 'branch/$CI_COMMIT_REF_SLUG'
          when: never
        - if: '$CI_COMMIT_BRANCH'
          variables:
            ENVIRONMENT_NAME: 'branch/$CI_COMMIT_REF_SLUG'
        - if: '$CI_COMMIT_TAG'
          variables:
            ENVIRONMENT_NAME: 'release/$CI_COMMIT_TAG'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          variables:
            ENVIRONMENT_NAME: 'review/$CI_MERGE_REQUEST_IID'
        - when: always
      # runner size tags (CI-RUNNERS.md §4): set by the runner platform on every runner of that size
      setup_tags:
        - mlr-linux-small-amd64
      run_many_tags: # run-many and test; test is raised to large in .gitlab/ci/workspace.yml
        - mlr-linux-medium-amd64
      nx_migrate_tags:
        - mlr-linux-medium-amd64
      rxap_compose_tags:
        - mlr-linux-medium-amd64
      localazy_tags:
        - mlr-linux-xsmall-amd64
      docker_tags:
        - mlr-linux-medium-amd64
        - docker
      startup_tags:
        - mlr-linux-medium-amd64
        - docker
      service_e2e_tags:
        - mlr-linux-medium-amd64
        - docker
        - e2e
      # documentation and coverage only on demand (Run the manual jobs), to save runner time
      typedoc_when: manual
      compodoc_when: manual
      pages_when: manual
      pages_merge_request_when: manual
      coverage_report_when: manual
      pages_needs:
        - job: run-many
          optional: true
        - job: writerside
          optional: true
        - job: workspace:typedoc
          optional: true

  - local: .gitlab/ci/workspace.yml
    rules: *workspace-pipeline
  # the component's `test` job, same conditions as its own include (see the file); the maintenance pipelines first
  - local: .gitlab/ci/workspace-test.yml
    rules:
      - if: '$RENOVATE == "true" || $SUPPLY_CHAIN_AUDIT == "true" || $FRAMEWORK_WATCH == "true" || $NX_RELEASE || $CI_PROJECT_PATH !~ /^(?:$[[ inputs.release ]])/'
        when: never
      - if: '$AI_ISSUE_IID || $AI_EPIC_IID'
        when: never
      - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
        when: always
      - if: '$CI_COMMIT_BRANCH =~ /^[0-9]+-/'
        when: never
      - if: '$CI_COMMIT_BRANCH =~ /^.+\/.+/'
        when: never
      - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^release:/'
        when: never
      - if: '$CI_COMMIT_BRANCH == "rxap/compose"'
        when: never
      - if: '$CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH'
        when: never
      - when: always
  # semgrep-sast, secret_detection, pages, coverage-report: the union of the conditions under which the component
  # drops any of them (nx-workspace `templates/nx-workspace.yml`), so that an override never outlives its job.
  # Where it is dropped here although the job exists the job simply takes the default runner size.
  - local: .gitlab/ci/workspace-conditional.yml
    rules:
      - if: '$RENOVATE == "true" || $SUPPLY_CHAIN_AUDIT == "true" || $FRAMEWORK_WATCH == "true" || $NX_RELEASE || $CI_PROJECT_PATH !~ /^(?:$[[ inputs.release ]])/'
        when: never
      - if: '$AI_ISSUE_IID || $AI_EPIC_IID'
        when: never
      - if: '$CI_COMMIT_TAG'
        when: never
      - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
        when: never
      - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(renovate\/|snyk-)/ || $CI_COMMIT_BRANCH =~ /^(renovate\/|snyk-)/'
        when: never
      - if: '$CI_COMMIT_BRANCH =~ /^[0-9]+-/'
        when: never
      - if: '$CI_COMMIT_BRANCH =~ /^.+\/.+/'
        when: never
      - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^release:/'
        when: never
      - if: '$CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH'
        when: never
      - when: always
  # writerside only exists where the component includes it (tags, default branch): same rules
  - local: .gitlab/ci/writerside.yml
    rules:
      - if: '$RENOVATE == "true" || $SUPPLY_CHAIN_AUDIT == "true" || $FRAMEWORK_WATCH == "true" || $NX_RELEASE || $CI_PROJECT_PATH !~ /^(?:$[[ inputs.release ]])/'
        when: never
      - if: '$AI_ISSUE_IID || $AI_EPIC_IID'
        when: never
      - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^release:/'
        when: never
      - if: '$CI_COMMIT_TAG'
      - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - local: .gitlab/ci/supply-chain.yml
  - local: .gitlab/ci/renovate.yml
  - local: .gitlab/ci/framework-watch.yml
  # nightly / stable / publish-only releases with npm trusted publishing (RELEASE_WORKFLOW.md)
  - local: .gitlab/ci/release.yml
  # fix agent for red renovate/* and migrate/* merge request pipelines (AGENT-FIX.md)
  - local: .gitlab/ci/agent-fix.yml
    rules: *workspace-pipeline
