# Generated by tools/scripts/release-inputs.mjs from the "packages" release group: do not edit by hand.
# The Run pipeline form shows these inputs; they only set the release variables below (`variables:`).
spec:
  inputs:
    release:
      description: 'Release to run: nightly (development, -dev prerelease), stable (latest, graduation), publish-only (pack and publish the newest release commit again). Empty: a normal pipeline.'
      default: ''
      options: [ '', 'nightly', 'stable', 'publish-only' ]
    release_specifier:
      description: 'Release: version bump instead of the conventional commits (e.g. prerelease bumps every selected package). Empty: from the commits.'
      default: ''
      options: [ '', 'prerelease', 'patch', 'minor', 'major', 'prepatch', 'preminor', 'premajor' ]
    release_projects_angular_1:
      description: 'Release: only these Angular packages (angular-authentication … angular-material-authentication). Leave every project list empty to release all changed packages.'
      type: array
      default: []
      options:
        - angular-authentication
        - angular-authorization
        - angular-bootstrap
        - angular-changelog
        - angular-components
        - angular-config
        - angular-contenteditable
        - angular-data-grid
        - angular-data-source
        - angular-definition
        - angular-dialog
        - angular-directives
        - angular-environment
        - angular-error
        - angular-firebase
        - angular-form-system
        - angular-form-window-system
        - angular-forms
        - angular-handlebars
        - angular-icon
        - angular-keycloak
        - angular-layout
        - angular-life-cycle
        - angular-localize
        - angular-marker-io
        - angular-material-authentication
    release_projects_angular_2:
      description: 'Release: only these Angular packages (angular-material-directives … angular-window-system). Leave every project list empty to release all changed packages.'
      type: array
      default: []
      options:
        - angular-material-directives
        - angular-material-form-system
        - angular-material-localize
        - angular-material-table-select
        - angular-material-table-system
        - angular-material-table-window-system
        - angular-memory
        - angular-oauth
        - angular-oauth2-proxy
        - angular-open-api
        - angular-pipes
        - angular-pub-sub
        - angular-remote-method
        - angular-sentry
        - angular-service-worker
        - angular-services
        - angular-socket-io
        - angular-status-check
        - angular-table-system
        - angular-theme
        - angular-timeago
        - angular-tree
        - angular-upload
        - angular-user
        - angular-utilities
        - angular-window-system
    release_projects_nest:
      description: 'Release: only these NestJS packages. Leave every project list empty to release all changed packages.'
      type: array
      default: []
      options:
        - nest-auth0
        - nest-dto
        - nest-firebase
        - nest-gitlab
        - nest-gitlab-release
        - nest-jwt
        - nest-keyv-minio
        - nest-logger
        - nest-minio
        - nest-oauth2-proxy
        - nest-open-api
        - nest-openfga
        - nest-rabbitmq
        - nest-rabbitmq-vault
        - nest-sentry
        - nest-server
        - nest-socket-io-client
        - nest-testing
        - nest-typeorm
        - nest-utilities
        - nest-valkey
        - nest-vault
    release_projects_tooling:
      description: 'Release: only these Nx plugins, schematics, presets and workspace tools. Leave every project list empty to release all changed packages.'
      type: array
      default: []
      options:
        - plugin-angular
        - plugin-application
        - plugin-compodoc
        - plugin-docker
        - plugin-gitlab-ci
        - plugin-gpt
        - plugin-library
        - plugin-localazy
        - plugin-nestjs
        - plugin-ng-prism
        - plugin-open-api
        - plugin-typedoc
        - plugin-utilities
        - plugin-workspace
        - preset-angular
        - preset-workspace
        - schematic-angular
        - schematic-composer
        - schematic-nestjs
        - schematic-open-api
        - schematic-ts-morph
        - schematic-utilities
        - schematic-xml-parser
        - workspace-open-api
        - workspace-ts-morph
        - workspace-utilities
    release_projects_other:
      description: 'Release: only these all other packages (n8n, node, browser, utilities, ...). Leave every project list empty to release all changed packages.'
      type: array
      default: []
      options:
        - browser-localize
        - browser-tailwind
        - browser-theme
        - browser-utilities
        - data-structure-tree
        - fs
        - json-schema-to-typescript
