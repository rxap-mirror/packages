variables:
  ADDITIONAL_TARGET_OPTIONS: --exclude tag:demo
  NX_MIGRATE_POST_SCRIPT: post-migrate
  RXAP_COMPOSE_COMMAND: schematic
include:
  - component: gitlab.com/rxap/gitlab-ci/base@~latest
  - component: gitlab.com/rxap/gitlab-ci/nx-workspace@6.3.2-edge.2
    inputs:
      version: "6.3.2-edge.2"
      workflow_rules:
        # skip realseit pipelines. currently the group terraform will add the release it nighlity pipeline schdule
        # this will trigger a nighlty run with RELEASE_IT=true, but this repo does not use release-it but nx release
        # so this will trigger a full pipeline run per night and drain the CI credits
        - if: '$RELEASE_IT == "true"'
          when: never
        - if: '$CI_COMMIT_BRANCH'
          variables:
            ENVIRONMENT_NAME: 'branch/$CI_COMMIT_REF_SLUG'
        - if: '$CI_COMMIT_TAG'
          variables:
            ENVIRONMENT_NAME: 'release/$CI_COMMIT_TAG'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          variables:
            ENVIRONMENT_NAME: 'review/$CI_MERGE_REQUEST_IID'
        - when: always
      setup_tags:
        - setup
      run_many_tags:
        - run-many-mega
      pages_needs:
        - job: run-many
          optional: true
        - job: writerside
          optional: true
        - job: workspace:typedoc
          optional: true

workspace:typedoc:
  extends: .run
  stage: build
  tags:
    - run
  environment:
    action: prepare
    name: $CI_COMMIT_REF_NAME
  variables:
    ADDITIONAL_TARGET_OPTIONS: "--skip-nx-cache"
  artifacts:
    name: "${CI_COMMIT_REF_SLUG}_run_workspace_typedoc"
    paths:
      - docs
    expire_in: 1 week
  rules:
    - if: '$RELEASE_IT == "true"'
      when: never
    - if: '$RXAP_COMPOSE == "true"'
      when: never
    - if: '$NX_MIGRATE_PACKAGE == "true"'
      when: never
    - when: on_success
