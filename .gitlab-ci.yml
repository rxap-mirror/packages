variables:
  ADDITIONAL_TARGET_OPTIONS: --exclude angular
  NX_MIGRATE_POST_SCRIPT: post-migrate
  RXAP_COMPOSE_COMMAND: schematic
include:
  - component: gitlab.com/rxap/gitlab-ci/base@~latest
  - component: gitlab.com/rxap/gitlab-ci/nx-workspace@6.3.2-edge.1
    inputs:
      version: "6.3.2-edge.1"
      setup_tags:
        - setup
      run_many_tags:
        - run-many-mega

workspace:typedoc:
  extends: .run
  stage: build
  environment:
    action: prepare
    name: $CI_COMMIT_REF_NAME
  artifacts:
    name: "${CI_COMMIT_REF_SLUG}_run_workspace_typedoc"
    paths:
      - docs
    expire_in: 1 week
