# Renovate for this repository, run as a scheduled pipeline (RENOVATE=true) or started by hand (Run pipeline with
# RENOVATE=true). Repository settings live in renovate.json5, everything self-hosted lives here, so the job can move
# unchanged into a renovate component of rxap/gitlab-ci.
#
# Needs the CI variable RENOVATE_TOKEN (project access token "renovate-bot", role Developer, scopes api +
# write_repository; masked + protected) and optionally GITHUB_COM_TOKEN (read-only, release notes / rate limit).
# Activation checklist: RENOVATE.md.

renovate:
  # 14-day cooldown tier (~600k weekly downloads), pinned by digest
  image: renovate/renovate:44.227.4@sha256:fe058db9710840a4821f20190b3769e3ce709a049b8640aa2bf5f044969fe702
  stage: test
  tags:
    - mlr-linux-small-amd64
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    # containerbase installs the pnpm version of package.json#packageManager
    RENOVATE_BINARY_SOURCE: install
    RENOVATE_ALLOWED_COMMANDS: '["^node tools/scripts/renovate-post-upgrade\\.mjs$"]'
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/.renovate
    RENOVATE_REPOSITORY_CACHE: enabled
    RENOVATE_GIT_AUTHOR: "rxap renovate bot <renovate-bot@rxap.dev>"
    LOG_LEVEL: info
  # The runner's helper restores the cache as root and cannot hand it back to user 12021: the ML runner drops all
  # capabilities (cap_drop ALL), so the owner restore (lchown) fails silently, while the mode bits are kept. The
  # runner's umask 0000 only applies to its helper container; the renovate image keeps 0022, so the restored cache was
  # read-only for renovate (EACCES). The script sets umask 0000 itself, so the files it writes stay writable after a
  # root restore. Only cache/renovate (repository + package cache) is kept: renovate recreates
  # cache/__renovate-private-cache on every run. The key is v2 because the earlier archive was written with 0022.
  # Interim patch (2026-11-27), revisit once the ML runner offers an external cache: move the repository cache to it
  # (RENOVATE_REPOSITORY_CACHE_TYPE=s3://…) and the package cache to Redis (RENOVATE_REDIS_URL), then drop this
  # cache block and the umask line. Background: gitlab-org/gitlab#576350 (cache/artifacts not writable for non-root).
  cache:
    key: renovate-v2
    paths:
      - .renovate/cache/renovate
  script:
    - |
      if [ -z "$RENOVATE_TOKEN" ]; then
        echo "RENOVATE_TOKEN is not set (see RENOVATE.md)"
        exit 1
      fi
    # see the cache comment above: keeps the cached files writable after the runner restores them as root
    - umask 0000
    - renovate
  rules:
    - if: '$RENOVATE == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")'
