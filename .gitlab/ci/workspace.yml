# Jobs that extend or override jobs of the nx-workspace component. Included with the same rules as the component
# (.gitlab-ci.yml, &workspace-pipeline): in the scheduled maintenance pipelines the component is not loaded, and a
# job extending one of its templates would make the pipeline invalid.

workspace:typedoc:
  extends: .run
  stage: build
  tags:
    - mlr-linux-medium-amd64
  environment:
    action: prepare
    name: $CI_COMMIT_REF_NAME
  variables:
    ADDITIONAL_TARGET_OPTIONS: "--skip-nx-cache"
  artifacts:
    name: "${CI_COMMIT_REF_SLUG}_run_workspace_typedoc"
    paths:
      - docs
    expire_in: 1 week
  rules:
    - if: '$RELEASE_IT == "true"'
      when: never
    - if: '$RXAP_COMPOSE == "true"'
      when: never
    - if: '$NX_MIGRATE_PACKAGE == "true"'
      when: never
    - when: manual # on demand only (runner time); allow_failure: true from the component job

# nx-migrate (rxap/gitlab-ci templates/nx-migrate.yml) runs on every push to a migrate/* branch except its own
# commits. The fix agent (FRAMEWORK-WATCH.md) commits with an `Agent-Fix: <n>` trailer: those commits must not
# start the migration again. The rules repeat the component's rules, plus the agent rule.
nx-migrate:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /Agent-Fix: \d+/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(workspace\): migrate package/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^nx-migrate:/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(deps\): migrate package/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(workspace\): run post migration script/'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^migrate\//'
      when: always

# Runner size tags (CI-RUNNERS.md §4) for component and GitLab template jobs without a tags input that need another
# size than the default (.gitlab-ci.yml `default: tags`). Only jobs that are defined in every workspace pipeline can
# be overridden here (writerside is not defined on latest: it takes the default).
# Jobs that the component only includes under conditions (test, semgrep-sast, secret_detection, pages,
# coverage-report) are overridden in workspace-test.yml and workspace-conditional.yml with their own include rules.
workspace:compodoc:
  tags:
    - mlr-linux-medium-amd64
# Recreates the rxap/compose branch; its push runs rxap-compose (schematic composer → merge request). Only offered
# when a schematics file changed (not on every lockfile change: Renovate), and only started by hand; RXAP_COMPOSE=true
# (Run pipeline) still runs it at once. The component's rules are replaced.
trigger:rxap-compose:
  tags:
    - mlr-linux-xsmall-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_COMMIT_MESSAGE == "chore: update workspace"'
      when: never
    - if: '$RXAP_COMPOSE == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/schematics.{yml,yaml,json}"
        - "**/schematic.{yml,yaml,json}"
      when: manual
