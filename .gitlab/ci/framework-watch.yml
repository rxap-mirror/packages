# Framework watch (FRAMEWORK-WATCH.md): daily schedule with FRAMEWORK_WATCH=true (or Run pipeline with
# FRAMEWORK_WATCH=true). Finds the newest Angular / Nx / NestJS version whose whole package group passed the release
# cooldown and creates the branch migrate/<leader>/<version>; the push pipeline of that branch runs nx-migrate.
#
# Needs the CI variable GITLAB_TOKEN (project access token, role Developer, scopes api + write_repository; masked +
# protected). Without it the job only prints the plan.

framework-watch:
  extends: .supply-chain
  script:
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "GITLAB_TOKEN is not set (see FRAMEWORK-WATCH.md): dry run only"
        node tools/scripts/framework-watch.mjs
      else
        node tools/scripts/framework-watch.mjs --apply
      fi
  rules:
    - if: '$FRAMEWORK_WATCH == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")'
