  - "@babel/generator@8.1.3"
  - "@babel/helper-module-transforms@8.1.3"
  - "@babel/helper-string-parser@7.29.15"
  - "@babel/helper-string-parser@8.1.3"
  - "@babel/helper-wrap-function@8.1.3"
  - "@babel/helpers@7.29.15"
  - "@babel/helpers@8.1.3"
  - "@babel/parser@7.29.15"
  - "@babel/parser@8.1.3"
  - "@babel/plugin-transform-block-scoping@8.1.3"
  - "@babel/plugin-transform-computed-properties@8.1.3"
  - "@babel/plugin-transform-duplicate-keys@8.1.3"
  - "@babel/plugin-transform-explicit-resource-management@8.1.3"
  - "@babel/plugin-transform-export-namespace-from@8.1.3"
  - "@babel/plugin-transform-for-of@8.1.3"
