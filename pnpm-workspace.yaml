# pnpm settings for this workspace (pnpm >= 11 reads them only from here).
# overrides: exact pins written by tools/scripts/audit-lockfile-cooldown.mjs --write-resolutions.
packages:
  - packages/*
  - packages/angular/*
  - packages/angular/material/*
  - packages/n8n/nodes/*
  - packages/n8n/*
  - packages/browser/*
  - packages/plugin/*
  - packages/preset/*
  - packages/schematic/*
  - packages/data-structure/*
  - packages/node/*
  - packages/nest/*
  - packages/workspace/*
linkWorkspacePackages: deep
autoInstallPeers: false
publicHoistPattern:
  - "@types/*"
  - "*eslint*"
  - "*prettier*"
  - "@angular-devkit/*"
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  "@firebase/util": false
  "@scarf/scarf": false
  "@sentry/node-cpu-profiler": false
  cpu-features: false
  isolated-vm: false
  protobufjs: false
  ssh2: false
patchedDependencies:
  "@ng-prism/core@22.8.0": patches/@ng-prism__core@22.8.0.patch
  "@ng-prism/plugin-jsdoc@22.8.0": patches/@ng-prism__plugin-jsdoc@22.8.0.patch
