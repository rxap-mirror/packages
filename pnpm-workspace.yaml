# refuse a version published with less trust (provenance / trusted publisher) than an earlier one
trustPolicy: no-downgrade
trustPolicyExclude:
  # reviewed 2026-11-25: maintenance-line releases (2023-07 to 2025-12) by the packages' known maintainers, published
  # without provenance after newer lines adopted it; no takeover. Exact versions only, an update is checked again.
  - "@langchain/core@0.3.80"
  - "@langchain/openai@0.6.17"
  - "jose@4.15.9"
  - "langchain@0.3.37"
  - "pino@9.14.0"
  # reviewed 2026-11-25: security fix of the 6.x line by maintainer fenster, who also published the 6.11.5 it replaces
  - "protobufjs@6.11.6"
  - "semver@5.7.2"
  - "semver@6.3.1"
  - "undici-types@6.21.0"
linkWorkspacePackages: deep
autoInstallPeers: false
publicHoistPattern:
  - "@types/*"
  - "*eslint*"
  - "*prettier*"
  - "@angular-devkit/*"
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  "@firebase/util": false
  "@scarf/scarf": false
  "@sentry/node-cpu-profiler": false
  cpu-features: false
  isolated-vm: false
  protobufjs: false
  ssh2: false
