# pnpm settings for this workspace (pnpm >= 11 reads them only from here).
# overrides: exact pins written by tools/scripts/audit-lockfile-cooldown.mjs --write-resolutions.
packages:
  - packages/*
  - packages/angular/*
  - packages/angular/material/*
  - packages/n8n/nodes/*
  - packages/n8n/*
  - packages/browser/*
  - packages/plugin/*
  - packages/preset/*
  - packages/schematic/*
  - packages/data-structure/*
  - packages/node/*
  - packages/nest/*
  - packages/workspace/*
# Supply-chain floor (see UPGRADE-NOTES.md section 4). pnpm refuses versions younger than 7 days (the lowest
# cooldown tier); `pnpm supply-chain:check` enforces the 14/30-day tiers on top and honours the same exclusions.
# Exceptions (e.g. a CVE fix that is still too young) are manual only: an exact `name@version` entry below a comment
# `# <reason>: remove after YYYY-MM-DD` (the date applies to every entry up to the next such comment), plus an exact
# pin in `overrides` where needed. supply-chain:check fails once the date has passed.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # permanent: our own packages, linked from the workspace (the e2e-pm Verdaccio versions are brand new)
  - "@rxap/*"
  # from before the cooldown rule (2026-11-22 upgrade): remove after 2026-11-28
